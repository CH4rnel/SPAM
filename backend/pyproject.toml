[project]
name = "spam-network"
version = "0.1.0"
description = "Anonymous AI-powered crypto social network"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "asyncpg",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "python-dotenv",
    "aiogram",
]


[dependency-groups]

dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
]


[tool.ruff]

line-length = 88
target-version = "py314"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
]

ignore = [
    "E402",
]


[tool.ruff.lint.isort]

known-first-party = [
    "app",
]

force-sort-within-sections = true
